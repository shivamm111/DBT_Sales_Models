version: 2

models:
  - name: bronze_date #  Must match the filename of a model -- including case sensitivity.
    config:
      materialized: view
      schema: bronze

  - name: bronze_product #  Must match the filename of a model -- including case sensitivity.
    config:
      materialized: view
      schema: bronze

  - name: bronze_sales
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null
      - name: gross_amount
        data_tests:
          - non_negative_generic
    config:
      materialized: view
      schema: bronze


  - name: bronze_store
    columns:
      - name: store_name
        data_tests: 
          - accepted_values:
              arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin','MegaMart San Jose','MegaMart Toronto'] 
    columns:
      - name: country
        data_tests: 
          - accepted_values:
              arguments:
                values: ['USA','Canada']
    config:
      severnity: warn
      materialized: view
      schema: bronze  
    